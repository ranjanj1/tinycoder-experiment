[package]
name = "tinycoder"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "tinycoder"
path = "src/main.rs"

[[bin]]
name = "tinycoder-agent"
path = "src/agent_main.rs"

[dependencies]
rmcp = { version = "3.9", default-features = false, features = ["server", "client", "transport-io", "transport-child-process"] }
tokio = { version = "1", features = ["rt", "process", "io-std", "io-util", "time", "fs", "sync", "net", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json"] }
regex = "1"
anyhow = "1"
clap = { version = "4", features = ["derive"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
